name: Keep App Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # toutes les 10 minutes
  workflow_dispatch:          # déclenchement manuel possible

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping l'application
        run: |
          echo "Ping de l'app à $(date)"
          URL="${{ secrets.APP_URL }}"
          URL="${URL%/}/up"
          curl --fail --silent --show-error --max-time 60 --retry 2 "$URL" \
            && echo "App OK" \
            || echo "App ne répond pas (encore en cours de démarrage)"
